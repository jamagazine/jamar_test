<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="AR сцена — портрет оживает" />
  <title>AR Портрет — Сцена</title>

  <!-- Preconnect to CDn domains — reduces handshake time on first load -->
  <link rel="preconnect" href="https://aframe.io" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://aframe.io" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

  <!-- A-Frame 1.4.0 — required for MindAR 1.2.5 compatibility -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    /* A-Frame manages its own canvas sizing — do NOT override a-scene position */
    body { margin: 0; overflow: hidden; background: transparent; font-family: 'Inter', sans-serif; }

    /* Loading overlay */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: #0a0a0f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      transition: opacity 0.5s;
    }
    #loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    #loading-overlay.gone { display: none; }

    .loading-spinner {
      width: 52px; height: 52px;
      border: 3px solid rgba(167,139,250,0.15);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: rgba(255,255,255,0.75);
      font-size: 0.95rem;
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }
    .loading-text strong {
      display: block;
      color: #fff;
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    #error-box {
      display: none;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 14px;
      padding: 16px 22px;
      color: #fca5a5;
      font-size: 0.88rem;
      max-width: 300px;
      text-align: center;
      line-height: 1.5;
    }
    #error-box.visible { display: block; }
  </style>
</head>
<body class="ar-page">

  <!-- ======================================
       AR OVERLAY UI  (above the camera)
       ====================================== -->
  <div id="ar-ui">

    <!-- Top bar -->
    <div class="ar-topbar">
      <a class="ar-topbar__back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Назад
      </a>
      <div class="ar-topbar__badge">
        <span class="ar-topbar__dot"></span>
        AR Live
      </div>
    </div>

    <!-- Finder frame (visual helper) -->
    <div class="ar-finder" id="arFinder"><span></span></div>

    <!-- Bottom scanning hint -->
    <div class="ar-hint">
      <div class="ar-hint__inner" id="arHint">
        📸 Наведи камеру на портрет
      </div>
    </div>

  </div>

  <!-- Loading overlay (visible before AR starts) -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">
      <strong id="loading-title">Инициализация AR…</strong>
      <span id="loading-sub">Загрузка маркера и камеры</span>
    </div>
    <div id="error-box"></div>
  </div>

  <!-- ======================================
       A-FRAME AR SCENE
       ====================================== -->
  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: assets/targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
      filterMinCF: 0.01;
      filterBeta: 10;
      missTolerance: 10;
      warmupTolerance: 3;
    "
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <!--
        ┌──────────────────────────────────────────────────────────┐
        │  ЗАМЕНИ portrait-video.mp4 на имя своего видеофайла!    │
        │  Файл должен лежать в папке assets/                      │
        └──────────────────────────────────────────────────────────┘
      -->
      <video
        id="portrait-video"
        src="assets/portrait-video.mp4"
        preload="none"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!--
      mindar-image-target index="0" — первый (и единственный) маркер
      из файла targets.mind

      Размеры plane подбираются под пропорции маркера.
      width="1" соответствует ширине маркера = 1 единица A-Frame.
      Измени height под соотношение сторон своего фото (portrait — обычно 3/4).
    -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        id="arVideo"
        src="#portrait-video"
        position="0 0 0"
        width="1"
        height="1.333"
        rotation="0 0 0"
      ></a-video>
    </a-entity>

  </a-scene>

  <!-- ======================================
       LOGIC — events & UI updates
       ====================================== -->
  <script>
    const hint    = document.getElementById('arHint');
    const finder  = document.getElementById('arFinder');
    const video   = document.getElementById('portrait-video');
    const scene   = document.getElementById('arScene');
    const overlay = document.getElementById('loading-overlay');
    const errorBox = document.getElementById('error-box');
    const loadingTitle = document.getElementById('loading-title');
    const loadingSub   = document.getElementById('loading-sub');

    function hideOverlay() {
      overlay.classList.add('fade-out');
      setTimeout(() => overlay.classList.add('gone'), 500);
    }

    function showError(msg) {
      loadingTitle.textContent = 'Ошибка';
      loadingSub.textContent = '';
      document.querySelector('.loading-spinner').style.display = 'none';
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }

    // Called when MindAR detects the target
    function onTargetFound() {
      console.log('[AR] Target found');
      hint.textContent = '✅ Портрет найден!';
      hint.classList.remove('hidden');
      finder.classList.add('found');
      video.play().catch(err => console.warn('[AR] Video play error:', err));
      setTimeout(() => hint.classList.add('hidden'), 2500);
    }

    // Called when MindAR loses the target
    function onTargetLost() {
      console.log('[AR] Target lost');
      video.pause();
      finder.classList.remove('found');
      hint.textContent = '📸 Наведи камеру на портрет';
      hint.classList.remove('hidden');
    }

    // Bind target events
    scene.addEventListener('loaded', () => {
      console.log('[AR] Scene loaded');
      loadingTitle.textContent = 'Запуск камеры…';
      loadingSub.textContent = 'Разреши доступ к камере в браузере';
      const target = document.querySelector('[mindar-image-target]');
      if (target) {
        target.addEventListener('targetFound', onTargetFound);
        target.addEventListener('targetLost',  onTargetLost);
      }
    });

    // MindAR is initialised and scanning
    scene.addEventListener('arReady', () => {
      console.log('[AR] MindAR ready');
      hideOverlay();
    });

    // MindAR error (missing .mind file, camera denied, etc.)
    scene.addEventListener('arError', (evt) => {
      const detail = evt.detail || evt;
      console.error('[AR] MindAR error:', detail);
      const msg = (typeof detail === 'string')
        ? detail
        : (detail?.message || JSON.stringify(detail));

      if (msg && msg.toLowerCase().includes('fetch')) {
        showError('⚠️ Файл targets.mind не найден.\nПоложи скомпилированный маркер в папку assets/ и задеплой снова.');
      } else if (msg && msg.toLowerCase().includes('camera')) {
        showError('📷 Нет доступа к камере.\nРазреши камеру в настройках браузера.');
      } else {
        showError('❌ Ошибка AR: ' + (msg || 'неизвестная'));
      }
    });
  </script>

</body>
</html>
